<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="./shared modules/general.css">

    <link
        rel="icon"
        href="https://cdn3.emoji.gg/emojis/8390-suicide.png"
        type="image/x-icon"
    >

    <title>Suffering Counter</title>
</head>

<body>

    <div id="header"></div>

    <main>
        <h1 id="page-title">Konec utrpení</h1>

        <section id="countdowns">
            <div class="countdown">
                <h2>Do konce roku</h2>
                <p id="year-countdown"></p>
                <p id="year-progress"></p>
            </div>

            <div class="countdown">
                <h2>Do konce školy</h2>
                <p id="school-countdown"></p>
                <p id="school-progress"></p>
            </div>
        </section>

        <section id="school-summary">
            <p id="total-days"></p>
            <p id="school-days"></p>
            <p id="school-hours"></p>
        </section>

        <section id="remaining-hours">
            <h2>Zbývající hodiny</h2>

            <div id="subject-hours"></div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="./shared modules/header.js"></script>
    <script src="./shared modules/footer.js"></script>
    <script type="module" src="index.js"></script>

</body>
</html>
